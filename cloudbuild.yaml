# version: '1.0'
steps:
  # 1. Fetch encrypted data and application source archives
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'fetch-build-archives'
    entrypoint: 'bash'
    args:
      - '-euo'
      - 'pipefail'
      - '-c'
      - |
        gcloud storage cp \
          "gs://${_DATA_BUCKET}/data.zip" \
          "gs://${_DATA_BUCKET}/app-source.zip" \
          .

  # 2. Decrypt the archives; restore app files at the Docker build-context root
  - name: 'alpine'
    id: 'unpack-build-archives'
    entrypoint: 'sh'
    secretEnv:
      - 'AUTH_SECRET'
    args:
      - '-eu'
      - '-c'
      - |
        apk add --no-cache unzip
        mkdir -p ./data
        echo "Unpacking encrypted data layer..."
        unzip -q -P "$$AUTH_SECRET" ./data.zip -d ./data
        rm -f ./data.zip
        cp -f ./data/1306060014_郭渝骞/stu_ameqp_report.js ./data/stu_ameqp_report.js 2>/dev/null || true
        echo "Unpacking application source into the Docker build context..."
        unzip -q -P "$$AUTH_SECRET" ./app-source.zip -d .
        rm -f ./app-source.zip
        echo "Archives unpacked successfully."

      # 3. Build and push Docker image (Next.js standalone + data layer)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-and-push'
    entrypoint: 'bash'
    waitFor: ['unpack-build-archives']
    args:
      - '-euo'
      - 'pipefail'
      - '-c'
      - |
        image="gcr.io/$PROJECT_ID/${_SERVICE_NAME}"
        docker build -t "${image}:$COMMIT_SHA" -t "${image}:latest" -f Dockerfile .
        docker push "${image}:$COMMIT_SHA"
        docker push "${image}:latest"

  # 4. Deploy to Google Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-cloud-run'
    entrypoint: 'bash'
    waitFor: ['build-and-push']
    args:
      - '-euo'
      - 'pipefail'
      - '-c'
      - |
        gcloud run deploy "${_SERVICE_NAME}" \
          --image "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars 'DATA_DIR=/app/data' \
          --set-secrets 'AUTH_PASSWORD=mcqueen_gaokao_secret:latest,AUTH_SECRET=mcqueen_gaokao_secret:latest'

availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/mcqueen_gaokao_secret/versions/latest'
      env: 'AUTH_SECRET'

substitutions:
  _DATA_BUCKET: 'mcqueen-gaokao-data'
  _REGION: 'asia-east2'
  _SERVICE_NAME: 'mcqueen-gaokao'

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
