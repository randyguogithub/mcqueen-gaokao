steps:
  # 1. Package and upload the encrypted data layer
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'package-and-upload-data'
    entrypoint: 'bash'
    secretEnv:
      - 'AUTH_SECRET'
    args:
      - '-euo'
      - 'pipefail'
      - '-c'
      - |
        apt-get update
        apt-get install -y --no-install-recommends zip
        bash scripts/package-and-upload.sh "${_DATA_BUCKET}"

  # 2. Fetch encrypted data.zip from GCP Cloud Storage Bucket
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'fetch-encrypted-data'
    entrypoint: 'bash'
    waitFor: ['package-and-upload-data']
    args:
      - '-euo'
      - 'pipefail'
      - '-c'
      - |
        archive="data.zip"
        source_uri="gs://${_DATA_BUCKET}/${archive}"
        echo "Fetching encrypted archive from ${source_uri}..."
        gsutil cp "${source_uri}" "${archive}"

  # 3. Decrypt & unpack data.zip with password into ./data
  - name: 'alpine'
    id: 'unpack-encrypted-data'
    entrypoint: 'sh'
    secretEnv:
      - 'AUTH_SECRET'
    args:
      - '-eu'
      - '-c'
      - |
        apk add --no-cache unzip
        mkdir -p ./data
        echo "Unpacking encrypted data layer..."
        unzip -q -P "$$AUTH_SECRET" ./data.zip -d ./data
        rm -f ./data.zip
        echo "Data unpacked successfully. Files:"
        ls -la ./data

  # 4. Build and push Docker image (Next.js standalone + data layer)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-and-push'
    entrypoint: 'bash'
    waitFor: ['unpack-encrypted-data']
    args:
      - '-euo'
      - 'pipefail'
      - '-c'
      - |
        image="gcr.io/$PROJECT_ID/${_SERVICE_NAME}"
        docker build -t "${image}:$COMMIT_SHA" -t "${image}:latest" -f Dockerfile .
        docker push "${image}:$COMMIT_SHA"
        docker push "${image}:latest"

  # 5. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'bash'
    waitFor: ['build-and-push']
    args:
      - '-euo'
      - 'pipefail'
      - '-c'
      - |
        gcloud run deploy "${_SERVICE_NAME}" \
          --image "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars 'DATA_DIR=/app/data' \
          --set-secrets 'AUTH_PASSWORD=AUTH_SECRET:latest,AUTH_SECRET=AUTH_SECRET:latest'

availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/AUTH_SECRET/versions/latest'
      env: 'AUTH_SECRET'

substitutions:
  _DATA_BUCKET: 'mcqueen-gaokao-data'
  _REGION: 'asia-east2'
  _SERVICE_NAME: 'mcqueen-gaokao'

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
